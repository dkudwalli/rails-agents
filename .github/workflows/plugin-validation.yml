name: Plugin validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  portable:
    name: Portable payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifests, skills, and links
        run: scripts/verify_plugins.sh
      - name: Verify profile renderer contract
        run: bash test/render_profile_test.sh
      - name: Verify portable payload boundary
        run: bash test/plugin_payload_test.sh

  host-smoke:
    name: ${{ matrix.host }} / Rails Engineer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, antigravity, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest Claude Code
        if: matrix.host == 'claude'
        run: npm install --global @anthropic-ai/claude-code

      - name: Install latest Codex
        if: matrix.host == 'codex'
        run: npm install --global @openai/codex

      - name: Install latest Antigravity CLI
        if: matrix.host == 'antigravity'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install latest OpenCode
        if: matrix.host == 'opencode'
        run: npm install --global opencode-ai

      - name: Validate Claude plugin metadata
        if: matrix.host == 'claude'
        run: claude plugin validate --strict ./rails-engineer

      - name: Install and list the Codex plugin
        if: matrix.host == 'codex'
        run: |
          codex plugin marketplace add . --json
          codex plugin add rails-engineer@rails-engineer --json
          codex plugin list | rg 'rails-engineer@rails-engineer'

      - name: Validate and install the Antigravity plugin
        if: matrix.host == 'antigravity'
        run: |
          agy plugin validate ./rails-engineer
          agy plugin install ./rails-engineer
          agy plugin list | rg '"name": "rails-engineer"|rails-engineer'

      - name: Discover the OpenCode skill mirror
        if: matrix.host == 'opencode'
        run: |
          scripts/sync_skills_to_agents_dir.sh
          opencode debug skill > "$RUNNER_TEMP/opencode-skills.json"
          expected_skills=$(find rails-engineer/skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')
          jq --arg directory "$GITHUB_WORKSPACE/.agents/skills/" --argjson expected "$expected_skills" \
            '[.[] | select(.location | startswith($directory))] | length == $expected' \
            "$RUNNER_TEMP/opencode-skills.json" | rg '^true$'
